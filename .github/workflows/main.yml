
name: Build GridBot APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check ZIP file
        run: test -f GridBot_Android_Phone_Build.zip

      - name: Unpack project ZIP
        run: unzip -q GridBot_Android_Phone_Build.zip -d source

      - name: Check Android project
        run: test -f source/gridbot_project/app/build.gradle.kts

      - name: Create debug signing key
        run: |
          cd source/gridbot_project
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: cd source/gridbot_project && gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridBot-debug-apk
          path: source/gridbot_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

